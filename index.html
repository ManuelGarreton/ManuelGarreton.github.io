<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomía de la Bicicleta</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F4F1EA;
  --surface: #FFFFFF;
  --border: rgba(0,0,0,0.09);
  --text-primary: #1A1A18;
  --text-secondary: #5A5A56;
  --text-muted: #9A9A94;
  --eng-bg: #FFFBF0;
  --eng-border: #E8D89A;
  --eng-text: #5A4A10;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100dvh;
}

/* ── HEADER ── */
header {
  padding: 1.125rem 2rem 1rem;
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 1rem;
}
header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.5rem, 3.5vw, 2.1rem);
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
.header-hint {
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

/* ── SVG AREA ── */
.svg-wrap { padding: 1rem 1.25rem 1.5rem; }
#bsvg {
  width: 100%;
  border: 0.5px solid var(--border);
  border-radius: 16px;
  background: #FAFAF7;
  display: block;
  cursor: pointer;
}
.part { cursor: pointer; transition: opacity 0.18s ease; }
.part:hover { opacity: 0.72; }

/* ── OVERLAY ── */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(235,231,222,0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
#overlay.open { display: flex; }

/* ── CARD ── */
#card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 16px 56px rgba(0,0,0,0.13);
  width: min(480px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  position: relative;
  animation: cardIn 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  scrollbar-width: none;
}
#card::-webkit-scrollbar { display: none; }

@keyframes cardIn {
  from { opacity: 0; transform: scale(0.93) translateY(10px); }
  to   { opacity: 1; transform: scale(1)    translateY(0); }
}

.card-close {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  padding: 0.875rem 0.875rem 0;
  background: linear-gradient(to bottom, #fff 70%, transparent);
}
.close-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,0.07);
  border: none; cursor: pointer;
  font-size: 18px; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; flex-shrink: 0;
}
.close-btn:hover { background: rgba(0,0,0,0.13); }

/* image area */
.card-img-wrap {
  margin: -0.5rem 1.25rem 0;
  border-radius: 12px;
  overflow: hidden;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-img-wrap img {
  width: 100%; height: 100%;
  object-fit: contain;
  padding: 0.75rem;
}
.img-placeholder {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0.5rem; width: 100%; height: 100%;
  color: var(--text-muted);
}
.img-placeholder .ph-icon { font-size: 2.5rem; opacity: 0.35; }
.img-placeholder .ph-name { font-size: 0.8125rem; font-weight: 500; opacity: 0.7; }
.img-placeholder .ph-sub { font-size: 0.65rem; letter-spacing: 0.05em; opacity: 0.45; text-transform: uppercase; }

/* card header */
.card-header {
  padding: 1rem 1.5rem 0.875rem;
  border-bottom: 0.5px solid var(--border);
}
.card-badge {
  display: inline-block;
  font-size: 0.6rem; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 3px 9px;
  border-radius: 20px; margin-bottom: 0.5rem; font-weight: 500;
}
.card-name {
  font-family: 'DM Serif Display', serif;
  font-size: 1.9rem; font-weight: 400;
  letter-spacing: -0.02em; color: var(--text-primary);
  line-height: 1.1; margin-bottom: 4px;
}
.card-materials {
  font-size: 0.8125rem; color: var(--text-muted); font-style: italic;
}

/* card body */
.card-body { padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

.field-label {
  font-size: 0.6rem; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--text-muted);
  margin-bottom: 5px; font-weight: 500;
}
.field-text {
  font-size: 0.875rem; color: var(--text-secondary); line-height: 1.65;
}

/* engineering block */
.eng-block {
  background: var(--eng-bg);
  border: 0.5px solid var(--eng-border);
  border-radius: 10px;
  padding: 1rem 1.125rem;
}
.eng-label {
  font-size: 0.6rem; text-transform: uppercase;
  letter-spacing: 0.1em; color: #9A7C20;
  margin-bottom: 5px; font-weight: 500;
}
.eng-text {
  font-size: 0.875rem; color: var(--eng-text); line-height: 1.65;
}

.card-footer { height: 0.5rem; }

footer {
  text-align: center; padding: 0.875rem;
  font-size: 0.6875rem; color: var(--text-muted);
  letter-spacing: 0.04em;
}

@media (max-width: 600px) {
  header { padding: 1rem 1.25rem; }
  .svg-wrap { padding: 0.75rem; }
  .card-img-wrap { height: 140px; }
  .card-name { font-size: 1.6rem; }
  .card-header, .card-body { padding-left: 1.25rem; padding-right: 1.25rem; }
}
</style>
</head>
<body>

<header>
  <h1>Anatomía de la Bicicleta</h1>
  <span class="header-hint">Toca una pieza para explorarla</span>
</header>

<div class="svg-wrap">
  <svg id="bsvg" viewBox="0 0 620 505" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div id="overlay">
  <div id="card">
    <div class="card-close">
      <button class="close-btn" id="close-btn">×</button>
    </div>
    <div class="card-img-wrap" id="card-img-wrap"></div>
    <div class="card-header">
      <span class="card-badge" id="card-badge"></span>
      <p class="card-name" id="card-name"></p>
      <p class="card-materials" id="card-materials"></p>
    </div>
    <div class="card-body">
      <div>
        <p class="field-label">Función y utilidad</p>
        <p class="field-text" id="card-fn"></p>
      </div>
      <div class="eng-block">
        <p class="eng-label">⚙ ¿Y dónde está la ingeniería?</p>
        <p class="eng-text" id="card-eng"></p>
      </div>
    </div>
    <div class="card-footer"></div>
  </div>
</div>

<footer>Exposición · ¿Y dónde está la ingeniería?</footer>

    eng:'Una rueda de bicicleta es un sistema de pretensado: los rayos no empujan la llanta hacia afuera, sino que la cuelgan de la maza jalándola hacia adentro. Todos los rayos están en tensión permanente, y cuando la rueda toca el suelo, los rayos del sector inferior simplemente se tensan menos — no se comprimen. Este principio permite usar rayos de apenas 2mm que serían inútiles en compresión. El tensado correcto convierte una llanta flexible en una estructura que soporta más de 100 veces el peso del propio conjunto.'

/* ── SVG ── */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, a={}) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(a)) e.setAttribute(k,v);
  return e;
}
function lbl(x,y,text,fill,size=9,anchor='middle') {
  const t = el('text',{x,y,'text-anchor':anchor,'font-size':size,fill,'pointer-events':'none','font-family':'DM Sans, sans-serif'});
  t.textContent = text; return t;
}
function mkPart(id) {
  const g = el('g',{class:'part','data-id':id});
  g.addEventListener('click', e=>{e.stopPropagation(); openCard(id);});
  g.addEventListener('touchstart', e=>{e.preventDefault(); openCard(id);},{passive:false});
  return g;
}

/* ── INTERACCIÓN ── */
function openCard(id) {
  const d = PARTS[id];
  if (!d) return;

  svg.querySelectorAll('.part').forEach(p =>
    p.style.opacity = p.getAttribute('data-id') === id ? '1' : '0.15'
  );

  // badge
  const badge = document.getElementById('card-badge');
  badge.textContent = 'Pieza ' + d.num;
  badge.style.cssText = `display:inline-block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:.5rem;font-weight:500;background:${d.bg};color:${d.tc};border:.5px solid ${d.c}`;

  document.getElementById('card-name').textContent = d.name;
  document.getElementById('card-materials').textContent = d.materials;
  document.getElementById('card-fn').textContent = d.fn;
  document.getElementById('card-eng').textContent = d.eng;

  // imagen
  const wrap = document.getElementById('card-img-wrap');
  wrap.style.background = d.bg;
  wrap.innerHTML = '';
  const img = document.createElement('img');
  img.alt = d.imgAlt;
  img.src = d.img;
  img.onerror = () => {
    wrap.innerHTML = `
      <div class="img-placeholder">
        <span class="ph-icon">📷</span>
        <span class="ph-name">${d.name}</span>
        <span class="ph-sub">Reemplazar con foto real → ${d.img}</span>
      </div>`;
  };
  wrap.append(img);

  document.getElementById('card').scrollTop = 0;
  document.getElementById('overlay').classList.add('open');
}

function closeCard() {
  document.getElementById('overlay').classList.remove('open');
  svg.querySelectorAll('.part').forEach(p => p.style.opacity = '1');
}

document.getElementById('close-btn').addEventListener('click', closeCard);
document.getElementById('overlay').addEventListener('click', e => {
  if (!e.target.closest('#card')) closeCard();
});
svg.addEventListener('click', e => {
  if (!e.target.closest('.part')) closeCard();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
